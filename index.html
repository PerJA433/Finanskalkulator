// ---------- Hjelpere ----------
const parseNum = (v) => {
  if (v === "" || v === null || v === undefined) return NaN;
  const cleaned = String(v).replace(/\s/g, "").replace(",", ".");
  const n = Number(cleaned);
  return Number.isFinite(n) ? n : NaN;
};

const fmt = (n, dec = 2, lang = "no") => {
  if (!Number.isFinite(n)) return "—";
  const s = n.toLocaleString(lang === "no" ? "nb-NO" : "en-US", {
    minimumFractionDigits: dec,
    maximumFractionDigits: dec,
  });
  return s;
};

const pct = (n, dec = 2, lang = "no") =>
  Number.isFinite(n) ? `${fmt(n * 100, dec, lang)} %` : "—";

// Obligasjonspris gitt periodrente
const bondPrice = (Cper, N, yPer, FV) => {
  if (yPer === 0) return Cper * N + FV;
  const disc = Math.pow(1 + yPer, N);
  const annuity = (Cper / yPer) * (1 - 1 / disc);
  return annuity + FV / disc;
};

// Løs periodrente fra pris (biseksjon)
const solvePeriodYield = (Cper, N, FV, target) => {
  let lo = 1e-9,
    hi = 2.0;
  const f = (y) => bondPrice(Cper, N, y, FV) - target;
  if (f(lo) < 0) return NaN; // pris høyere enn undiskontert sum
  for (let i = 0; i < 200; i++) {
    const mid = (lo + hi) / 2;
    const fm = f(mid);
    if (Math.abs(fm) < 1e-9) return mid;
    if (fm > 0) lo = mid;
    else hi = mid;
  }
  return (lo + hi) / 2;
};

// ---------- UI-byggeklosser ----------
const Field = ({ label, children }) => (
  <label className="fk-field">
    <span className="fk-label">{label}</span>
    {children}
  </label>
);

const NumInput = ({ value, onChange, placeholder }) => (
  <input
    className="fk-input"
    inputMode="decimal"
    value={value}
    placeholder={placeholder}
    onChange={(e) => onChange(e.target.value)}

);

const Result = ({ label, value, accent }) => (
  <div className={`fk-result ${accent ? "fk-result-accent" : ""}`}>
    <span className="fk-result-label">{label}</span>
    <span className="fk-result-value">{value}</span>
  </div>
);

const Steps = ({ show, lines }) =>
  show && lines.length ? (
    <div className="fk-steps">
      {lines.map((l, i) => (
        <div key={i} className="fk-step-line" dangerouslySetInnerHTML={{ __html: l }} />

// ============================================================
//  MODUL: OBLIGASJON
// ============================================================
function BondModule({ t, lang, showSteps }) {
  const [mode, setMode] = useState("price"); // price | ytm
  const [zero, setZero] = useState(false);
  const [semi, setSemi] = useState(false);
  const [callable, setCallable] = useState(false);
  const [fv, setFv] = useState("1000");
  const [coupon, setCoupon] = useState("4");
  const [yrs, setYrs] = useState("5");
  const [ytmIn, setYtmIn] = useState("5");
  const [priceIn, setPriceIn] = useState("970");
  const [callYrs, setCallYrs] = useState("2");
  const [callPrice, setCallPrice] = useState("1000");

  const calc = useMemo(() => {
    const FV = parseNum(fv);
    const cRate = zero ? 0 : parseNum(coupon) / 100;
    const pp = semi ? 2 : 1;
    const N = parseNum(yrs) * pp;
    const Cper = (cRate * FV) / pp;
    const steps = [];
    if (![FV, N].every(Number.isFinite) || N <= 0) return { steps };

    if (mode === "price") {
      const yPer = parseNum(ytmIn) / 100 / pp;
      if (!Number.isFinite(yPer)) return { steps };
      const price = bondPrice(Cper, N, yPer, FV);
      steps.push(`Kupong per periode: ${fmt(cRate * 100, 2, lang)} % · ${fmt(FV, 0, lang)} ${semi ? "/ 2" : ""} = <b>${fmt(Cper, 2, lang)}</b>`);
      steps.push(`Periodrente: ${fmt(parseNum(ytmIn), 2, lang)} %${semi ? " / 2" : ""} = <b>${fmt(yPer * 100, 3, lang)} %</b> · perioder N = <b>${fmt(N, 0, lang)}</b>`);
      if (!zero)
        steps.push(`Annuitet: ${fmt(Cper, 2, lang)} × (1/${fmt(yPer, 4, lang)})(1 − 1/${fmt(1 + yPer, 4, lang)}^${fmt(N, 0, lang)})`);
      steps.push(`Pålydende neddiskontert: ${fmt(FV, 0, lang)} / ${fmt(1 + yPer, 4, lang)}^${fmt(N, 0, lang)}`);
      const status =
        Math.abs(price - FV) < 0.005 ? "par" : price > FV ? "premium" : "discount";
      return {
        steps,
        rows: [
          { label: t.resultPrice, value: fmt(price, 2, lang) },
          { label: t.resultPricePct, value: `${fmt((price / FV) * 100, 3, lang)} %`, accent: true },
          { label: t.parStatus, value: t[status] },
        ],
      };
    } else {
      const target = parseNum(priceIn);
      if (!Number.isFinite(target)) return { steps };
      const yPer = solvePeriodYield(Cper, N, FV, target);
      const ytm = yPer * pp;
      steps.push(`Løser numerisk for periodrenten som gir pris = <b>${fmt(target, 2, lang)}</b>`);
      steps.push(`Periodrente funnet: <b>${fmt(yPer * 100, 4, lang)} %</b>${semi ? " → × 2 for årlig" : ""}`);
      const rows = [
        { label: t.resultYtm, value: pct(ytm, 2, lang), accent: true },
      ];
      if (callable) {
        const Nc = parseNum(callYrs) * pp;
        const CP = parseNum(callPrice);
        if (Number.isFinite(Nc) && Number.isFinite(CP)) {
          const yPerC = solvePeriodYield(Cper, Nc, CP, target);
          const ytc = yPerC * pp;
          steps.push(`YTC: samme pris, ${fmt(Nc, 0, lang)} perioder, innløsning ${fmt(CP, 0, lang)}`);
          rows.push({ label: t.resultYtc, value: pct(ytc, 2, lang), accent: true });
        }
      }
      return { steps, rows };
    }
  }, [mode, zero, semi, callable, fv, coupon, yrs, ytmIn, priceIn, callYrs, callPrice, t, lang]);

  return (
    <div className="fk-grid">
      <div className="fk-inputs">
        <div className="fk-seg">
          <button className={mode === "price" ? "fk-seg-on" : ""} onClick={() => setMode("price")}>
            {t.priceFromYtm}
          </button>
          <button className={mode === "ytm" ? "fk-seg-on" : ""} onClick={() => setMode("ytm")}>
            {t.ytmFromPrice}
          </button>
        </div>

        <div className="fk-checks">
          <label><input type="checkbox" checked={zero} onChange={(e) => setZero(e.target.checked)} /> {t.zero}</label>
          <label><input type="checkbox" checked={semi} onChange={(e) => setSemi(e.target.checked)} /> {t.semi}</label>
          {mode === "ytm" && (
            <label><input type="checkbox" checked={callable} onChange={(e) => setCallable(e.target.checked)} /> {t.callable}</label>
          )}
        </div>

        <Field label={t.faceValue}><NumInput value={fv} onChange={setFv} /></Field>
        {!zero && <Field label={t.couponRate}><NumInput value={coupon} onChange={setCoupon} /></Field>}
        <Field label={t.years}><NumInput value={yrs} onChange={setYrs} /></Field>
        {mode === "price" ? (
          <Field label={t.ytm}><NumInput value={ytmIn} onChange={setYtmIn} /></Field>
        ) : (
          <Field label={t.price}><NumInput value={priceIn} onChange={setPriceIn} /></Field>
        )}
        {mode === "ytm" && callable && (
          <>
            <Field label={t.callYears}><NumInput value={callYrs} onChange={setCallYrs} /></Field>
            <Field label={t.callPrice}><NumInput value={callPrice} onChange={setCallPrice} /></Field>
          </>
        )}
      </div>

      <div className="fk-output">
        {calc.rows ? calc.rows.map((r, i) => <Result key={i} {...r} />) : <p className="fk-empty">{t.fillIn}</p>}
        <Steps show={showSteps} lines={calc.steps || []} />
      </div>
    </div>
  );
}

// ============================================================
//  MODUL: DDM (Gordon growth)
// ============================================================
function DdmModule({ t, lang, showSteps }) {
  const [useG, setUseG] = useState(true);
  const [d1, setD1] = useState("2.43");
  const [ret, setRet] = useState("0.42");
  const [roe, setRoe] = useState("15");
  const [gIn, setGIn] = useState("6.3");
  const [coc, setCoc] = useState("12.2");

  const calc = useMemo(() => {
    const D1 = parseNum(d1);
    const rE = parseNum(coc) / 100;
    const g = useG ? (parseNum(ret) * parseNum(roe)) / 100 : parseNum(gIn) / 100;
    const steps = [];
    if (![D1, rE, g].every(Number.isFinite)) return { steps };
    if (useG)
      steps.push(`Vekst g = retention × avkastning = ${fmt(parseNum(ret), 2, lang)} × ${fmt(parseNum(roe), 2, lang)} % = <b>${pct(g, 2, lang)}</b>`);
    if (g >= rE) return { steps, err: t.gGeR };
    const P = D1 / (rE - g);
    steps.push(`P₀ = D₁ / (rₑ − g) = ${fmt(D1, 2, lang)} / (${fmt(rE, 4, lang)} − ${fmt(g, 4, lang)})`);
    return {
      steps,
      rows: [
        { label: t.resultG, value: pct(g, 2, lang) },
        { label: t.resultShare, value: fmt(P, 2, lang), accent: true },
      ],
    };
  }, [useG, d1, ret, roe, gIn, coc, t, lang]);

  return (
    <div className="fk-grid">
      <div className="fk-inputs">
        <Field label={t.d1}><NumInput value={d1} onChange={setD1} /></Field>
        <div className="fk-checks">
          <label><input type="checkbox" checked={useG} onChange={(e) => setUseG(e.target.checked)} /> {t.useGrowthInputs}</label>
        </div>
        {useG ? (
          <>
            <Field label={t.retention}><NumInput value={ret} onChange={setRet} /></Field>
            <Field label={t.roe}><NumInput value={roe} onChange={setRoe} /></Field>
          </>
        ) : (
          <Field label={t.growth}><NumInput value={gIn} onChange={setGIn} /></Field>
        )}
        <Field label={t.coc}><NumInput value={coc} onChange={setCoc} /></Field>
      </div>
      <div className="fk-output">
        {calc.err && <p className="fk-warn">{calc.err}</p>}
        {calc.rows ? calc.rows.map((r, i) => <Result key={i} {...r} />) : (!calc.err && <p className="fk-empty">{t.fillIn}</p>)}
        <Steps show={showSteps} lines={calc.steps || []} />
      </div>
    </div>
  );
}

// ============================================================
//  MODUL: DCF / EV
// ============================================================
function DcfModule({ t, lang, showSteps }) {
  const [fcfs, setFcfs] = useState(["52.2", "68.7", "77.2", "75.6", "80.5"]);
  const [wacc, setWacc] = useState("14.9");
  const [tg, setTg] = useState("4.1");
  const [debt, setDebt] = useState("306");
  const [cash, setCash] = useState("0");
  const [shares, setShares] = useState("42");

  const setFcf = (i, v) => setFcfs((a) => a.map((x, j) => (j === i ? v : x)));
  const addYear = () => setFcfs((a) => [...a, ""]);
  const removeYear = () => setFcfs((a) => (a.length > 1 ? a.slice(0, -1) : a));

  const calc = useMemo(() => {
    const r = parseNum(wacc) / 100;
    const g = parseNum(tg) / 100;
    const vals = fcfs.map(parseNum);
    const steps = [];
    if (!Number.isFinite(r) || vals.some((v) => !Number.isFinite(v))) return { steps };
    const N = vals.length;
    let pv = 0;
    vals.forEach((v, i) => {
      pv += v / Math.pow(1 + r, i + 1);
    });
    steps.push(`NV av ${N} eksplisitte FCF neddiskontert med ${fmt(parseNum(wacc), 2, lang)} % = <b>${fmt(pv, 2, lang)}</b>`);
    let ev = pv,
      tv = NaN,
      pvTv = NaN;
    if (Number.isFinite(g) && r > g) {
      const fcfNext = vals[N - 1] * (1 + g);
      tv = fcfNext / (r - g);
      pvTv = tv / Math.pow(1 + r, N);
      steps.push(`FCF år ${N + 1} = ${fmt(vals[N - 1], 2, lang)} × ${fmt(1 + g, 4, lang)} = <b>${fmt(fcfNext, 2, lang)}</b>`);
      steps.push(`Terminalverdi (v/ år ${N}) = ${fmt(fcfNext, 2, lang)} / (${fmt(r, 4, lang)} − ${fmt(g, 4, lang)}) = <b>${fmt(tv, 2, lang)}</b>`);
      steps.push(`NV terminalverdi = ${fmt(tv, 2, lang)} / ${fmt(1 + r, 4, lang)}^${N} = <b>${fmt(pvTv, 2, lang)}</b>`);
      ev = pv + pvTv;
    }
    const D = parseNum(debt) || 0;
    const C = parseNum(cash) || 0;
    const sh = parseNum(shares);
    const equity = ev - D + C;
    const rows = [];
    if (Number.isFinite(tv)) {
      rows.push({ label: t.resultPvExplicit, value: fmt(pv, 2, lang) });
      rows.push({ label: t.resultPvTv, value: fmt(pvTv, 2, lang) });
    }
    rows.push({ label: t.resultEv, value: fmt(ev, 2, lang), accent: true });
    if (Number.isFinite(sh) && sh > 0) {
      steps.push(`Egenkapital = EV − gjeld + kontant = ${fmt(ev, 2, lang)} − ${fmt(D, 2, lang)} + ${fmt(C, 2, lang)} = <b>${fmt(equity, 2, lang)}</b>`);
      steps.push(`Aksjekurs = ${fmt(equity, 2, lang)} / ${fmt(sh, 0, lang)}`);
      rows.push({ label: t.resultEquity, value: fmt(equity, 2, lang) });
      rows.push({ label: t.resultDcfShare, value: fmt(equity / sh, 2, lang), accent: true });
    }
    return { steps, rows };
  }, [fcfs, wacc, tg, debt, cash, shares, t, lang]);

  return (
    <div className="fk-grid">
      <div className="fk-inputs">
        <div className="fk-fcf-head">
          <span className="fk-label">{t.fcfs}</span>
          <div className="fk-fcf-btns">
            <button onClick={removeYear}>{t.removeYear}</button>
            <button onClick={addYear}>{t.addYear}</button>
          </div>
        </div>
        <div className="fk-fcf-list">
          {fcfs.map((v, i) => (
            <div key={i} className="fk-fcf-row">
              <span className="fk-fcf-yr">{i + 1}</span>
              <NumInput value={v} onChange={(nv) => setFcf(i, nv)} />
            </div>
          ))}
        </div>
        <Field label={t.wacc}><NumInput value={wacc} onChange={setWacc} /></Field>
        <Field label={t.terminalG}><NumInput value={tg} onChange={setTg} /></Field>
        <Field label={t.debt}><NumInput value={debt} onChange={setDebt} /></Field>
        <Field label={t.cash}><NumInput value={cash} onChange={setCash} /></Field>
        <Field label={t.shares}><NumInput value={shares} onChange={setShares} /></Field>
      </div>
      <div className="fk-output">
        {calc.rows && calc.rows.length ? calc.rows.map((r, i) => <Result key={i} {...r} />) : <p className="fk-empty">{t.fillIn}</p>}
        <Steps show={showSteps} lines={calc.steps || []} />
      </div>
    </div>
  );
}

// ============================================================
//  MODUL: KREDITTRISIKO (zero-coupon m/ default)
// ============================================================
function CreditModule({ t, lang, showSteps }) {
  const [fv, setFv] = useState("100");
  const [price, setPrice] = useState("73");
  const [yrs, setYrs] = useState("5");
  const [pDef, setPDef] = useState("50");
  const [rec, setRec] = useState("90");
  const [rf, setRf] = useState("");

  const calc = useMemo(() => {
    const FV = parseNum(fv);
    const P = parseNum(price);
    const n = parseNum(yrs);
    const p = parseNum(pDef) / 100;
    const recov = parseNum(rec) / 100;
    const steps = [];
    if (![FV, P, n].every(Number.isFinite) || P <= 0 || n <= 0) return { steps };

    const promisedYtm = Math.pow(FV / P, 1 / n) - 1;
    steps.push(`Lovet YTM = (${fmt(FV, 0, lang)}/${fmt(P, 2, lang)})^(1/${fmt(n, 0, lang)}) − 1 = <b>${pct(promisedYtm, 2, lang)}</b>`);
    const rows = [{ label: t.resultPromisedYtm, value: pct(promisedYtm, 2, lang) }];

    if (Number.isFinite(p) && Number.isFinite(recov)) {
      const expPayoff = (1 - p) * FV + p * recov * FV;
      const expReturn = Math.pow(expPayoff / P, 1 / n) - 1;
      steps.push(`Forventet utbetaling = (1 − ${fmt(p, 2, lang)})·${fmt(FV, 0, lang)} + ${fmt(p, 2, lang)}·${fmt(recov, 2, lang)}·${fmt(FV, 0, lang)} = <b>${fmt(expPayoff, 2, lang)}</b>`);
      steps.push(`Forventet avkastning = (${fmt(expPayoff, 2, lang)}/${fmt(P, 2, lang)})^(1/${fmt(n, 0, lang)}) − 1 = <b>${pct(expReturn, 2, lang)}</b>`);
      rows.push({ label: t.lossRate, value: pct(1 - recov, 0, lang) });
      rows.push({ label: t.resultExpPayoff, value: fmt(expPayoff, 2, lang) });
      rows.push({ label: t.resultExpReturn, value: pct(expReturn, 2, lang), accent: true });
    }
    const rfv = parseNum(rf);
    if (Number.isFinite(rfv)) {
      const spread = promisedYtm - rfv / 100;
      steps.push(`Kredittspread = lovet YTM − risikofri = ${pct(promisedYtm, 2, lang)} − ${fmt(rfv, 2, lang)} %`);
      rows.push({ label: t.resultSpread, value: pct(spread, 2, lang), accent: true });
    }
    return { steps, rows };
  }, [fv, price, yrs, pDef, rec, rf, t, lang]);

  return (
    <div className="fk-grid">
      <div className="fk-inputs">
        <p className="fk-hint">{t.creditIntro}</p>
        <Field label={t.faceValue}><NumInput value={fv} onChange={setFv} /></Field>
        <Field label={t.creditPrice}><NumInput value={price} onChange={setPrice} /></Field>
        <Field label={t.years}><NumInput value={yrs} onChange={setYrs} /></Field>
        <Field label={t.pDefault}><NumInput value={pDef} onChange={setPDef} /></Field>
        <Field label={t.recovery}><NumInput value={rec} onChange={setRec} /></Field>
        <Field label={t.riskfree}><NumInput value={rf} onChange={setRf} /></Field>
      </div>
      <div className="fk-output">
        {calc.rows ? calc.rows.map((r, i) => <Result key={i} {...r} />) : <p className="fk-empty">{t.fillIn}</p>}
        <Steps show={showSteps} lines={calc.steps || []} />
      </div>
    </div>
  );
}

function App() {
  const [lang, setLang] = useState("no");
  const [tab, setTab] = useState("bond");
  const [showSteps, setShowSteps] = useState(true);
  const t = T[lang];

  return (
    <div className="fk-root">
      <style>{CSS}</style>
      <header className="fk-header">
        <div>
          <h1 className="fk-title">{t.title}</h1>
          <p className="fk-sub">{t.subtitle}</p>
        </div>
        <div className="fk-controls">
          <label className="fk-toggle">
            <input type="checkbox" checked={showSteps} onChange={(e) => setShowSteps(e.target.checked)} />
            <span>{t.steps}</span>
          </label>
          <button className="fk-lang" onClick={() => setLang(lang === "no" ? "en" : "no")}>
            {t.lang}
          </button>
        </div>
      </header>

      <nav className="fk-tabs">
        {Object.keys(t.tabs).map((k) => (
          <button key={k} className={tab === k ? "fk-tab-on" : ""} onClick={() => setTab(k)}>
            {t.tabs[k]}
          </button>
        ))}
      </nav>

      <main className="fk-main">
        {tab === "bond" && <BondModule t={t} lang={lang} showSteps={showSteps} />}
        {tab === "ddm" && <DdmModule t={t} lang={lang} showSteps={showSteps} />}
        {tab === "dcf" && <DcfModule t={t} lang={lang} showSteps={showSteps} />}
        {tab === "credit" && <CreditModule t={t} lang={lang} showSteps={showSteps} />}
      </main>

      <footer className="fk-footer">{t.disclaimer}</footer>
    </div>
  );
}
